<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandi-1 — Order Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Roboto+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #17130f;
    --panel: #221c16;
    --panel-2: #2a221a;
    --line: #3a3026;
    --amber: #f0a238;
    --red: #e15a4f;
    --red-glow: #e15a4f55;
    --green: #4caf7d;
    --text: #f2ece2;
    --text-dim: #a89a86;
    --text-mute: #6b5f50;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background: var(--bg); color: var(--text); font-family: 'Archivo', sans-serif; min-height: 100vh; padding: 20px 20px 60px; }
  header{ display:flex; align-items:center; justify-content:space-between; padding-bottom: 18px; margin-bottom: 22px; border-bottom: 2px solid var(--line); flex-wrap: wrap; gap: 14px; }
  .brand{ display:flex; align-items:baseline; gap: 12px; }
  .brand h1{ font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .brand span{ font-family:'Roboto Mono', monospace; font-size:12px; color: var(--text-mute); letter-spacing: 0.08em; }
  .right-controls{ display:flex; align-items:center; gap: 16px; flex-wrap: wrap; }
  .status{ display:flex; align-items:center; gap: 10px; font-family:'Roboto Mono', monospace; font-size: 13px; color: var(--text-dim); }
  .dot{ width:9px; height:9px; border-radius:50%; background: var(--green); }
  .dot.offline{ background: var(--red); }
  .count-pill{ background: var(--red); color: #1a0f0c; font-weight: 800; font-size: 15px; padding: 6px 14px; border-radius: 999px; display:none; }
  .count-pill.show{ display:inline-block; }
  .add-btn{ background: var(--amber); color: #241705; border:none; padding: 10px 18px; border-radius: 8px; font-weight: 800; font-size: 14px; cursor:pointer; font-family:'Archivo', sans-serif; }
  .add-btn:hover{ opacity: 0.9; }
  .nalli-toggle{ display:flex; align-items:center; gap: 9px; font-family:'Roboto Mono', monospace; font-size: 12.5px; color: var(--text-dim); background: var(--panel); border:1px solid var(--line); padding: 8px 14px; border-radius: 999px; }
  .toggle-switch{ position:relative; width:40px; height:22px; border-radius:999px; border:none; background: var(--green); cursor:pointer; padding:0; transition: background 0.15s ease; }
  .toggle-switch.off{ background: var(--text-mute); }
  .toggle-knob{ position:absolute; top:2px; left:20px; width:18px; height:18px; border-radius:50%; background:#fff; transition: left 0.15s ease; }
  .toggle-switch.off .toggle-knob{ left:2px; }
  .toggle-switch:disabled{ opacity:0.5; cursor:default; }
  #nalliToggleLabel.off{ color: var(--red); }
  .empty{ text-align:center; padding: 90px 20px; color: var(--text-mute); }
  .empty .big{ font-size: 44px; margin-bottom: 10px; }
  .empty p{ font-family:'Roboto Mono', monospace; font-size: 13px; letter-spacing:0.04em; }
  .orders{ display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card{ position:relative; background: var(--panel); border: 2px solid var(--red); border-radius: 14px; padding: 18px 18px 16px; box-shadow: 0 0 0 4px var(--red-glow); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%, 100%{ box-shadow: 0 0 0 4px var(--red-glow); } 50%{ box-shadow: 0 0 0 10px transparent; } }
  .card.acked{ border-color: var(--green); box-shadow: none; animation: none; opacity: 0.9; }
  .remove-btn{ position:absolute; top:10px; right:10px; width:24px; height:24px; border-radius:50%; border:1px solid var(--line); background: var(--panel-2); color: var(--text-dim); font-family:'Roboto Mono', monospace; font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .remove-btn:hover{ background: var(--red); color:#1a0f0c; border-color: var(--red); }
  .card-actions{ display:flex; gap: 8px; }
  .print-btn{ flex:0 0 auto; padding: 12px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text-dim); font-weight:700; font-size: 13px; cursor:pointer; font-family:'Archivo', sans-serif; }
  .print-btn:hover{ color: var(--text); border-color: var(--text-dim); }
  .acked-label{ flex:1; text-align:center; padding: 11px; border-radius: 9px; border: 1px solid var(--green); color: var(--green); font-weight: 800; font-size: 13.5px; letter-spacing: 0.03em; font-family:'Archivo', sans-serif; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 12px; padding-right: 26px; }
  .order-id{ font-family:'Roboto Mono', monospace; font-weight:700; font-size: 15px; color: var(--amber); }
  .elapsed{ font-family:'Roboto Mono', monospace; font-size: 12px; color: var(--text-mute); }
  .customer{ font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .summary{ font-size: 13.5px; color: var(--text-dim); line-height: 1.5; margin-bottom: 12px; }
  .meta-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; }
  .price{ font-family:'Roboto Mono', monospace; font-weight:700; font-size: 17px; color: var(--text); }
  .source{ font-family:'Roboto Mono', monospace; font-size: 10.5px; text-transform:uppercase; letter-spacing: 0.08em; color: var(--text-mute); background: var(--panel-2); padding: 3px 8px; border-radius: 5px; }
  .badge-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 10px; }
  .badge{ font-family:'Roboto Mono', monospace; font-size: 10.5px; font-weight:700; text-transform:uppercase; letter-spacing: 0.06em; padding: 4px 9px; border-radius: 5px; }
  .badge.pickup{ background: #f0a23822; color: var(--amber); border: 1px solid #f0a23855; }
  .badge.dinein{ background: #4caf7d22; color: var(--green); border: 1px solid #4caf7d55; }
  .phone-line{ font-family:'Roboto Mono', monospace; font-size: 12.5px; color: var(--text-dim); margin-bottom: 4px; }
  .ack-btn{ width:100%; padding: 12px; border-radius: 9px; border: none; background: var(--green); color: #0e1f16; font-weight: 800; font-size: 14.5px; letter-spacing: 0.02em; cursor:pointer; font-family:'Archivo', sans-serif; transition: transform 0.08s ease, opacity 0.15s ease; }
  .ack-btn:hover{ opacity: 0.9; }
  .ack-btn:active{ transform: scale(0.98); }
  .ack-btn:disabled{ opacity: 0.5; cursor: default; }
  .setup{ max-width: 640px; margin: 40px auto; background: var(--panel); border:1px solid var(--line); border-radius: 12px; padding: 24px 26px; font-family:'Roboto Mono', monospace; font-size: 13px; color: var(--text-dim); line-height: 1.7; }
  .setup h2{ font-family:'Archivo',sans-serif; color: var(--text); font-size:16px; margin-bottom:10px; }
  .setup input{ width:100%; background: var(--panel-2); border:1px solid var(--line); color: var(--text); padding: 9px 11px; border-radius: 7px; font-family:'Roboto Mono', monospace; font-size: 12.5px; margin: 6px 0 14px; }
  .setup button{ background: var(--amber); color: #241705; border:none; padding: 10px 18px; border-radius: 7px; font-weight:800; font-family:'Archivo',sans-serif; cursor:pointer; font-size:13.5px; }

  .modal-overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index: 100; padding: 20px; }
  .modal-overlay.show{ display:flex; }
  .modal{ background: var(--panel); border:1px solid var(--line); border-radius: 14px; padding: 26px 26px 22px; width:100%; max-width: 420px; }
  .modal h2{ font-size:18px; margin-bottom: 16px; }
  .modal label{ display:block; font-family:'Roboto Mono', monospace; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; margin-top: 14px; }
  .modal input, .modal textarea, .modal select{ width:100%; background: var(--panel-2); border:1px solid var(--line); color: var(--text); padding: 10px 12px; border-radius: 8px; font-family:'Archivo', sans-serif; font-size: 14px; resize: vertical; }
  .modal textarea{ min-height: 70px; }
  .modal-actions{ display:flex; gap: 10px; margin-top: 22px; }
  .btn-primary{ flex:1; background: var(--amber); color: #241705; border:none; padding: 12px; border-radius: 9px; font-weight:800; cursor:pointer; font-family:'Archivo',sans-serif; font-size: 14px; }
  .btn-secondary{ flex:1; background: transparent; color: var(--text-dim); border:1px solid var(--line); padding: 12px; border-radius: 9px; font-weight:700; cursor:pointer; font-family:'Archivo',sans-serif; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>MANDI-1</h1>
    <span>ORDER BOARD</span>
  </div>
  <div class="right-controls">
    <div class="nalli-toggle" id="nalliToggleWrap" style="display:none;">
      <span>Nalli Biryani</span>
      <button class="toggle-switch" id="nalliToggleBtn" onclick="toggleNalli()">
        <span class="toggle-knob"></span>
      </button>
      <span id="nalliToggleLabel">Available</span>
    </div>
    <button class="add-btn" onclick="openWalkinModal()">+ Walk-in Order</button>
    <span class="count-pill" id="countPill">0 NEW</span>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">connecting…</span>
    </div>
  </div>
</header>

<div id="setupScreen" class="setup" style="display:none;">
  <h2>One-time setup</h2>
  <p>Paste your three n8n webhook URLs below, then click Save. Stored only in this browser.</p>
  <label>Pending orders URL (GET)</label>
  <input id="urlPending" placeholder="https://yourinstance.app.n8n.cloud/webhook/mandi-1-pending-orders">
  <label>Acknowledge order URL (POST)</label>
  <input id="urlAck" placeholder="https://yourinstance.app.n8n.cloud/webhook/mandi1-acknowledge-order">
  <label>Place order URL (POST) — same one ElevenLabs uses</label>
  <input id="urlOrders" placeholder="https://yourinstance.app.n8n.cloud/webhook/mandi1-orders">
  <label>Nalli Biryani status URL (GET)</label>
  <input id="urlNalliStatus" placeholder="https://yourinstance.app.n8n.cloud/webhook/mandi1-nalli-status">
  <label>Nalli Biryani toggle URL (POST)</label>
  <input id="urlNalliToggle" placeholder="https://yourinstance.app.n8n.cloud/webhook/mandi1-nalli-toggle">
  <button onclick="saveConfig()">Save & Start</button>
</div>

<div id="emptyState" class="empty" style="display:none;">
  <div class="big">✓</div>
  <p>NO PENDING ORDERS</p>
</div>

<div class="orders" id="ordersGrid"></div>

<div class="modal-overlay" id="walkinModal">
  <div class="modal">
    <h2>Add Walk-in Order</h2>
    <label>Customer Name</label>
    <input id="wiName" placeholder="e.g. Walk-in Customer">
    <label>Order Summary</label>
    <textarea id="wiSummary" placeholder="e.g. 2 x Lamb Mandi Meal, 1 x Butter Naan"></textarea>
    <label>Total Price (AUD)</label>
    <input id="wiPrice" type="number" step="0.01" placeholder="e.g. 70">
    <label>Phone Number</label>
    <input id="wiPhone" placeholder="e.g. 04XX XXX XXX">
    <label>Order Type</label>
    <select id="wiOrderType" onchange="toggleArrivalField()">
      <option value="Pickup">Pickup</option>
      <option value="Dine-in">Dine-in</option>
    </select>
    <label id="wiArrivalLabel">Estimated Pickup Time</label>
    <input id="wiArrival" placeholder="e.g. 20 minutes / 7:00 PM">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeWalkinModal()">Cancel</button>
      <button class="btn-primary" id="wiSubmitBtn" onclick="submitWalkin()">Add Order</button>
    </div>
  </div>
</div>

<script>
  const POLL_INTERVAL_MS = 5000;
  let PENDING_URL = localStorage.getItem('mandi1_pending_url') || '';
  let ACK_URL = localStorage.getItem('mandi1_ack_url') || '';
  let ORDERS_URL = localStorage.getItem('mandi1_orders_url') || '';
  let NALLI_STATUS_URL = localStorage.getItem('mandi1_nalli_status_url') || '';
  let NALLI_TOGGLE_URL = localStorage.getItem('mandi1_nalli_toggle_url') || '';
  let ordersState = {}; // orderId -> { data, acknowledged }
  let beeping = false;
  let audioCtx = null;
  let beepInterval = null;

  function initAudio(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playBeepOnce(){
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.35);
  }

  function startBeeping(){
    if (beeping) return;
    beeping = true;
    playBeepOnce();
    beepInterval = setInterval(playBeepOnce, 1800);
  }

  function stopBeeping(){
    beeping = false;
    if (beepInterval) clearInterval(beepInterval);
    beepInterval = null;
  }

  function saveConfig(){
    PENDING_URL = document.getElementById('urlPending').value.trim();
    ACK_URL = document.getElementById('urlAck').value.trim();
    ORDERS_URL = document.getElementById('urlOrders').value.trim();
    NALLI_STATUS_URL = document.getElementById('urlNalliStatus').value.trim();
    NALLI_TOGGLE_URL = document.getElementById('urlNalliToggle').value.trim();
    localStorage.setItem('mandi1_pending_url', PENDING_URL);
    localStorage.setItem('mandi1_ack_url', ACK_URL);
    localStorage.setItem('mandi1_orders_url', ORDERS_URL);
    localStorage.setItem('mandi1_nalli_status_url', NALLI_STATUS_URL);
    localStorage.setItem('mandi1_nalli_toggle_url', NALLI_TOGGLE_URL);
    document.getElementById('setupScreen').style.display = 'none';
    initAudio();
    fetchOrders();
    fetchNalliStatus();
  }

  async function fetchNalliStatus(){
    if (!NALLI_STATUS_URL) return;
    try{
      const res = await fetch(NALLI_STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      renderNalliToggle(data.available);
    }catch(e){ /* leave as-is on failure */ }
  }

  function renderNalliToggle(available){
    const wrap = document.getElementById('nalliToggleWrap');
    const btn = document.getElementById('nalliToggleBtn');
    const label = document.getElementById('nalliToggleLabel');
    wrap.style.display = 'flex';
    btn.classList.toggle('off', !available);
    btn.dataset.available = available ? '1' : '0';
    label.textContent = available ? 'Available' : 'Sold Out';
    label.classList.toggle('off', !available);
  }

  async function toggleNalli(){
    const btn = document.getElementById('nalliToggleBtn');
    const current = btn.dataset.available === '1';
    const next = !current;
    btn.disabled = true;
    try{
      await fetch(NALLI_TOGGLE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ available: next })
      });
      renderNalliToggle(next);
    }catch(e){
      alert('Could not update Nalli Biryani status. Check connection and try again.');
    }
    btn.disabled = false;
  }

  function elapsedText(timestamp){
    const then = new Date(timestamp).getTime();
    const mins = Math.max(0, Math.floor((Date.now() - then) / 60000));
    if (mins < 1) return 'just now';
    if (mins === 1) return '1 min ago';
    return mins + ' min ago';
  }

  async function ackOrder(orderId, btn){
    btn.disabled = true;
    btn.textContent = 'Marking…';
    try{
      await fetch(ACK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: orderId })
      });
      if (ordersState[orderId]) ordersState[orderId].acknowledged = true;
      renderAll();
    }catch(e){
      btn.disabled = false;
      btn.textContent = 'Acknowledge — try again';
    }
  }

  function removeCard(orderId){
    delete ordersState[orderId];
    renderAll();
  }

  function printOrder(orderId){
    const entry = ordersState[orderId];
    if (!entry) return;
    const o = entry.data;
    const win = window.open('', '_blank', 'width=380,height=600');
    win.document.write(`
      <html><head><title>Order ${o['Order id'] || ''}</title>
      <style>
        body{ font-family: monospace; padding: 16px; font-size: 14px; color:#000; }
        h2{ margin-bottom: 4px; }
        .line{ margin: 4px 0; }
        hr{ border: none; border-top: 1px dashed #000; margin: 10px 0; }
      </style>
      </head><body>
        <h2>MANDI-1</h2>
        <div class="line"><strong>Order:</strong> ${o['Order id'] || ''}</div>
        <div class="line"><strong>Time:</strong> ${o['Timestamp'] || ''}</div>
        <hr>
        <div class="line"><strong>Customer:</strong> ${o['Customer Name'] || ''}</div>
        ${o['Phone Number'] ? `<div class="line"><strong>Phone:</strong> ${o['Phone Number']}</div>` : ''}
        <div class="line"><strong>Type:</strong> ${o['Order Type'] || ''}</div>
        ${o['Table/Arrival'] ? `<div class="line"><strong>Time:</strong> ${o['Table/Arrival']}</div>` : ''}
        <hr>
        <div class="line">${(o['Order Summary'] || '').replace(/\n/g, '<br>')}</div>
        <hr>
        <div class="line"><strong>Total:</strong> $${o['Total Price'] || '0'}</div>
        <div class="line"><strong>Source:</strong> ${o['Source'] || ''}</div>
      </body></html>
    `);
    win.document.close();
    win.focus();
    win.print();
  }

  function openWalkinModal(){
    document.getElementById('walkinModal').classList.add('show');
    toggleArrivalField();
  }
  function closeWalkinModal(){
    document.getElementById('walkinModal').classList.remove('show');
    document.getElementById('wiName').value = '';
    document.getElementById('wiSummary').value = '';
    document.getElementById('wiPrice').value = '';
    document.getElementById('wiPhone').value = '';
    document.getElementById('wiOrderType').value = 'Pickup';
    document.getElementById('wiArrival').value = '';
  }

  function toggleArrivalField(){
    const isPickup = document.getElementById('wiOrderType').value === 'Pickup';
    document.getElementById('wiArrivalLabel').style.display = isPickup ? 'block' : 'none';
    document.getElementById('wiArrival').style.display = isPickup ? 'block' : 'none';
  }

  async function submitWalkin(){
    const btn = document.getElementById('wiSubmitBtn');
    const name = document.getElementById('wiName').value.trim() || 'Walk-in Customer';
    const summary = document.getElementById('wiSummary').value.trim();
    const price = document.getElementById('wiPrice').value.trim();
    const phone = document.getElementById('wiPhone').value.trim();
    const orderType = document.getElementById('wiOrderType').value;
    const arrival = orderType === 'Pickup' ? document.getElementById('wiArrival').value.trim() : '';

    if (!summary || !price){
      alert('Please fill in the order summary and total price.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Adding…';
    try{
      await fetch(ORDERS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'place_order',
          customer_name: name,
          order_summary: summary,
          total_price: price,
          phone_number: phone,
          order_type: orderType,
          arrival_time: arrival,
          source: 'Walk-in'
        })
      });
      closeWalkinModal();
      fetchOrders();
    }catch(e){
      alert('Could not submit the order. Check connection and try again.');
    }
    btn.disabled = false;
    btn.textContent = 'Add Order';
  }

  function renderAll(){
    render(Object.values(ordersState));
  }

  function render(entries){
    const grid = document.getElementById('ordersGrid');
    const empty = document.getElementById('emptyState');
    const pill = document.getElementById('countPill');

    if (!entries || entries.length === 0){
      grid.innerHTML = '';
      empty.style.display = 'block';
      pill.classList.remove('show');
      stopBeeping();
      return;
    }

    empty.style.display = 'none';
    const pendingCount = entries.filter(e => !e.acknowledged).length;
    if (pendingCount > 0){
      pill.classList.add('show');
      pill.textContent = pendingCount + ' NEW';
      startBeeping();
    } else {
      pill.classList.remove('show');
      stopBeeping();
    }

    grid.innerHTML = entries.map(entry => {
      const o = entry.data;
      const id = o['Order id'] || '';
      const acked = entry.acknowledged;
      const orderType = o['Order Type'] || '';
      const badgeClass = orderType.toLowerCase() === 'dine-in' ? 'dinein' : 'pickup';
      const badgeText = orderType || 'Pickup';
      const arrival = o['Table/Arrival'] || '';
      const phone = o['Phone Number'] || '';
      return `
      <div class="card ${acked ? 'acked' : ''}">
        <button class="remove-btn" onclick="removeCard('${id}')" title="Remove from board">✕</button>
        <div class="card-top">
          <span class="order-id">${id}</span>
          <span class="elapsed">${elapsedText(o['Timestamp'])}</span>
        </div>
        <div class="customer">${o['Customer Name'] || 'Customer'}</div>
        ${phone ? `<div class="phone-line">📞 ${phone}</div>` : ''}
        <div class="badge-row">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${arrival ? `<span class="badge pickup">ETA: ${arrival}</span>` : ''}
        </div>
        <div class="summary">${o['Order Summary'] || ''}</div>
        <div class="meta-row">
          <span class="price">$${o['Total Price'] || '0'}</span>
          <span class="source">${o['Source'] || ''}</span>
        </div>
        <div class="card-actions">
          ${acked
            ? `<div class="acked-label">✓ Acknowledged</div>`
            : `<button class="ack-btn" onclick="ackOrder('${id}', this)">Acknowledge</button>`}
          <button class="print-btn" onclick="printOrder('${id}')" title="Print order">🖨</button>
        </div>
      </div>
    `;}).join('');
  }

  async function fetchOrders(){
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    try{
      const res = await fetch(PENDING_URL + '?t=' + Date.now(), { cache: 'no-store' });
      const data = await res.json();
      dot.classList.remove('offline');
      txt.textContent = 'live';

      const incoming = (data.orders || []).filter(o => o && o['Order id']);
      const incomingIds = new Set(incoming.map(o => o['Order id']));

      // drop cards no longer pending on the backend that were never acknowledged/kept locally
      Object.keys(ordersState).forEach(id => {
        if (!ordersState[id].acknowledged && !incomingIds.has(id)) delete ordersState[id];
      });

      // add new pending orders; never overwrite a card staff already acknowledged locally
      incoming.forEach(o => {
        const id = o['Order id'];
        if (!ordersState[id] || !ordersState[id].acknowledged){
          ordersState[id] = { data: o, acknowledged: false };
        }
      });

      renderAll();
    }catch(e){
      dot.classList.add('offline');
      txt.textContent = 'connection lost';
    }
  }

  window.addEventListener('click', () => { if (!audioCtx) initAudio(); }, { once: true });

  if (!PENDING_URL || !ACK_URL || !ORDERS_URL || !NALLI_STATUS_URL || !NALLI_TOGGLE_URL){
    document.getElementById('setupScreen').style.display = 'block';
    document.getElementById('urlPending').value = PENDING_URL;
    document.getElementById('urlAck').value = ACK_URL;
    document.getElementById('urlOrders').value = ORDERS_URL;
    document.getElementById('urlNalliStatus').value = NALLI_STATUS_URL;
    document.getElementById('urlNalliToggle').value = NALLI_TOGGLE_URL;
  } else {
    fetchOrders();
    fetchNalliStatus();
  }

  setInterval(() => { if (NALLI_STATUS_URL) fetchNalliStatus(); }, 15000);

  setInterval(() => { if (PENDING_URL) fetchOrders(); }, POLL_INTERVAL_MS);
</script>

</body>
</html>
